  "2 cetpc": ["ALBERT","AUDISIO","BABA","BERTOLOTTO","BOUCHEE","BOUFFART","BOURGUIGNON","BOUSQUET","CAPPADORO","COLPAERT","CULMINE","DOYEN","GAALOUL","GEORGE","GUEURUNURIAN","MONTEIRO","PAGE","PALAGONIA","PELLET","PONZO","PRUVOST","RICHARD","TETI"]
};

const allThemes = [
  { name:"Nivellement mixte - Cheminement + Rayonnement", count:1, questions:Array(20).fill({ text:"Calculer l'altitude de tous les points" }) },
  { name:"Nivellement mixte difficile", count:1, questions:Array(20).fill({ text:"Calculer l'altitude de tous les points" }) },
  { name:"Nivellement mixte complexe", count:1, questions:Array(20).fill({ text:"Calculer l'altitude de tous les points" }) }
];

let selectedQuestions = [];
let currentIndex = 0;
let userAnswers = [];
let candidateName = "";
let score = 0;
let quizName = "MODULE 7 - NIVELLEMENT MIXTE";
let testType = "";
let questionCount = 1;
let themeFilter = null;
const DOM = {
  intro: document.getElementById("intro"),
  quiz: document.getElementById("quiz"),
  startBtn: document.getElementById("startBtn"),
  restartBtn: document.getElementById("restartBtn"),

function shuffle(arr){ return arr.sort(()=>Math.random()-0.5); }

// Génération de lectures finissant par 0, 2, 5 ou 7 (mm) avec contrainte d'unicité
function randLectureEnding(){
  const allowed=[0,2,5,7];
  const base=Math.floor(Math.random()*(399-10+1))+10; // base des dizaines: 10..399 -> 100..3990
  const digit=allowed[Math.floor(Math.random()*allowed.length)];
  return base*10+digit; // valeurs entre 100 et 3997
}
function uniqueLecture(exclude){
  let v;
  do { v=randLectureEnding(); } while(exclude.includes(v));
  return v;
}

function getRandomQuestionsIntercalated(filterTheme = null) {
  const themesToUse = filterTheme ? allThemes.filter(t => t.name === filterTheme) : allThemes;
  const questionsPerTheme = questionCount / themesToUse.length;
  const themeQuestions = themesToUse.map(theme => {
    const shuffled = shuffle([...theme.questions]);
    return shuffled.slice(0, questionsPerTheme).map(q => ({ ...q, theme: theme.name }));
  });

  const finalList = [];
  let remaining = true;
  let index = 0;

  while (remaining) {
    remaining = false;
    for (const questions of themeQuestions) {
      if (index < questions.length) {
        finalList.push(questions[index]);
        remaining = true;
      }
    }
    index++;
  }
  return finalList;
}

function renderQuestion(){
  const q = selectedQuestions[currentIndex];
  let lecture1, lecture2, alt1;
  let photoHTML = '';

  if(q.theme === "Nivellement mixte - Cheminement + Rayonnement"){
    // Génération des lectures pour les stations 1 à 5 (cheminement)

    const lecturePt1_st1 = uniqueLecture([lectureRef]);
    const lecturePt1_st2 = uniqueLecture([lectureRef, lecturePt1_st1]);
    const lecturePt2_st2 = uniqueLecture([lectureRef, lecturePt1_st1, lecturePt1_st2]);
    const lecturePt2_st3 = uniqueLecture([lectureRef, lecturePt1_st1, lecturePt1_st2, lecturePt2_st2]);
    const lecturePt3_st3 = uniqueLecture([lectureRef, lecturePt1_st1, lecturePt1_st2, lecturePt2_st2, lecturePt2_st3]);
    const lecturePt3_st4 = uniqueLecture([lectureRef, lecturePt1_st1, lecturePt1_st2, lecturePt2_st2, lecturePt2_st3, lecturePt3_st3]);

    // Station 5 (nouvelle)
    const lecturePt4_st5 = uniqueLecture([lectureRef, lecturePt1_st1, lecturePt1_st2, lecturePt2_st2, lecturePt2_st3, lecturePt3_st3, lecturePt3_st4, lecturePt4_st4]);
    const lecturePt5_st5 = uniqueLecture([lectureRef, lecturePt1_st1, lecturePt1_st2, lecturePt2_st2, lecturePt2_st3, lecturePt3_st3, lecturePt3_st4, lecturePt4_st4, lecturePt4_st5]);
    
    // Station 6 - Rayonnement (lecture arrière sur point 5, puis lectures avant sur points 6, 7, 8, 9)

    const lecturePt7_st6 = uniqueLecture([lecturePt5_st6_arriere, lecturePt6_st6]);
    const lecturePt8_st6 = uniqueLecture([lecturePt5_st6_arriere, lecturePt6_st6, lecturePt7_st6]);
    const lecturePt9_st6 = uniqueLecture([lecturePt5_st6_arriere, lecturePt6_st6, lecturePt7_st6, lecturePt8_st6]);

    // Station 3 : back 2, fores 4 et 5

    // Station 4 : back 5, fore 6

    // Station 5 : back 6, fores 7,8,9
    const bs56 = uniqueLecture([lectureRef,fs1_st1,bs21,fs22,fs23,bs32,fs34,fs35,bs45,fs46]);
    const fs57 = uniqueLecture([lectureRef,fs1_st1,bs21,fs22,fs23,bs32,fs34,fs35,bs45,fs46,bs56]);
    const fs58 = uniqueLecture([lectureRef,fs1_st1,bs21,fs22,fs23,bs32,fs34,fs35,bs45,fs46,bs56,fs57]);
    const fs59 = uniqueLecture([lectureRef,fs1_st1,bs21,fs22,fs23,bs32,fs34,fs35,bs45,fs46,bs56,fs57,fs58]);

function sendResultToSheet(){
  let totalPoints=0;
  selectedQuestions.forEach((q)=>{
    if(q.theme==="Nivellement mixte - Cheminement + Rayonnement"){
      totalPoints+=9;
    } else if(q.theme==="Nivellement mixte difficile"){
      totalPoints+=12;

      totalPoints+=16;
    }
  });
  const data={
    name:candidateName,
    score:score,
    maxPoints:totalPoints,
    quizName:quizName
  };

  const loadingDiv=document.getElementById("sendingStatus");
  if(loadingDiv){
    loadingDiv.style.display="block";
    loadingDiv.innerHTML='<p style="color:#ff6600; font-weight:bold;">⏳ Envoi des résultats en cours...</p>';
  }

  const downloadBtn=document.getElementById("downloadBtn");
  if(downloadBtn) downloadBtn.style.display="none";

  fetch("https://script.google.com/macros/s/AKfycbwugfP8ze_pM_RY9o3kIqf_KNVJuMbA6Y8ud2GTJAxlRWe8SlgN1eUmLae8jwzx4wZb/exec",{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(data)
  }).then(res=>res.json()).then(res=>{
    if(res.status==="success"){
      if(loadingDiv){
        loadingDiv.innerHTML='<p style="color:#388e3c; font-weight:bold;">✅ Résultats enregistrés avec succès !</p>';

function showIntro(){
  DOM.intro.style.display="flex";
  DOM.quiz.style.display="none";
  DOM.restartBtn.style.display="none";
  DOM.quizSubtitle.textContent="";
  DOM.pageTitle.textContent="Le nivellement mixte (cheminement + rayonnement)";
  DOM.testTypeSelection.style.display="block";
  DOM.nameSelection.style.display="none";
  DOM.candidateName.value="";
  DOM.startBtn.disabled=true;
  testType = "";
  questionCount = 10;
  themeFilter = null;
}

function selectTestType(type, count, theme = null){
  testType = type;
  questionCount = count;
  themeFilter = theme;
  DOM.pageTitle.textContent = type.toUpperCase();
  DOM.testTypeSelection.style.display="none";
  DOM.nameSelection.style.display="block";
  DOM.candidateName.focus();
  DOM.candidateName.oninput=()=>{ DOM.startBtn.disabled=DOM.candidateName.value.trim().length<2; };
}

function startQuiz(){
  candidateName=DOM.candidateName.value.trim().toUpperCase();
  if(!candidateName) return;
  const isAuthorized=Object.values(AUTHORIZED_CANDIDATES).some(group=>group.includes(candidateName));
  if(!isAuthorized){ alert("❌ Accès refusé. Votre nom n'est pas autorisé pour faire ce test."); DOM.candidateName.value=""; DOM.startBtn.disabled=true; return; }
  DOM.intro.style.display="none";
  DOM.quiz.style.display="block";
  quizName="MODULE 7 - NIVELLEMENT MIXTE - " + testType;
  selectedQuestions=getRandomQuestionsIntercalated(themeFilter);
  currentIndex=0;
  userAnswers=new Array(selectedQuestions.length).fill(0);
  DOM.quizSubtitle.textContent=i18n.questions.replace("{count}",selectedQuestions.length);
  renderQuestion();
}
